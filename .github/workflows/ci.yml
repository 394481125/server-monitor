name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - run: node --check monitor/static/app_logic.js
      - run: node --check monitor/static/app.js
      - run: node --check tests/acceptance/browser.js
      - run: node --test tests/frontend/*.test.js
      - run: python tests/acceptance/e2e.py
      - run: python -m compileall -q monitor tests scripts gunicorn.conf.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: server-monitor:ci

services:
  server-monitor:
    build: .
    image: server-monitor:local
    restart: unless-stopped
    ports:
      - "${SERVER_MONITOR_PORT:-8000}:8000"
    environment:
      SERVER_MONITOR_BIND: 0.0.0.0:8000
      SERVER_MONITOR_DATA_DIR: /var/lib/server-monitor
      SERVER_MONITOR_INITIAL_PASSWORD: "${SERVER_MONITOR_INITIAL_PASSWORD:-}"
      SERVER_MONITOR_HTTPS: "${SERVER_MONITOR_HTTPS:-0}"
    volumes:
      - server-monitor-data:/var/lib/server-monitor
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  server-monitor-data:
